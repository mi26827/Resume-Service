name: Basic checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-and-example-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Validate the synthetic DISCOVERY report
        run: python scripts/validate_output.py examples/tiny-task-api/sample-output
