interface:
  display_name: "Backend Repo Career Miner"
  short_description: "Mine backend repository evidence into truthful resume material"
  default_prompt: "Analyze this backend repository evidence-first using the user's requested mode. If no mode is specified, begin with DISCOVERY. Do not expand into contribution attribution, resume generation, or Agent proposals unless requested by the selected mode. Generate the optional technology learning guide only when explicitly requested after DISCOVERY or FULL analysis. First show an editable Markdown draft and wait for user approval; render HTML and PDF only from the approved version. Only propose an Agent when justified; deterministic automation or no opportunity are valid outcomes."
